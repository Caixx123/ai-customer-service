<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智 · 电商售后客服</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #6b7690;
            --line: #e4e8f2;
            --brand: #2f6bff;
            --brand-soft: #eaf0ff;
            --ok: #0f9f6e;
            --warn: #b45309;
            --err: #c2410c;
            --shadow: 0 18px 45px rgba(23, 32, 51, .08);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            margin: 0;
            color: var(--ink);
            background:
                radial-gradient(900px 500px at 8% -10%, #dfe9ff 0%, transparent 60%),
                radial-gradient(700px 420px at 100% 0%, #e8fff7 0%, transparent 55%),
                var(--bg);
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        .shell {
            max-width: 1080px;
            height: 100vh;
            margin: 0 auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, .86);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .logo {
            width: 42px; height: 42px; border-radius: 13px;
            display: grid; place-items: center;
            color: white; font-weight: 700; letter-spacing: .5px;
            background: linear-gradient(135deg, #2f6bff, #22b8a6);
            box-shadow: 0 8px 18px rgba(47, 107, 255, .28);
        }
        .brand h1 { margin: 0; font-size: 18px; letter-spacing: .2px; }
        .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
        .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
        select, button, textarea { font: inherit; }
        select {
            height: 36px; padding: 0 10px; border-radius: 10px;
            border: 1px solid var(--line); background: #fff; color: var(--ink);
            outline: none;
        }
        button {
            height: 36px; padding: 0 13px; border-radius: 10px;
            border: 1px solid var(--line); background: #fff; color: var(--ink);
            cursor: pointer; transition: .18s ease;
        }
        button:hover { border-color: #c9d4ee; transform: translateY(-1px); }
        button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
        .primary { background: var(--brand); border-color: var(--brand); color: #fff; }
        .primary:hover { background: #2458dd; }
        .ghost { background: transparent; }
        main {
            flex: 1; min-height: 0;
            display: grid; grid-template-columns: 1fr 280px; gap: 14px;
        }
        .chat {
            min-height: 0;
            display: flex; flex-direction: column;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        .messages {
            flex: 1; min-height: 0;
            overflow-y: auto;
            padding: 22px;
            display: flex; flex-direction: column; gap: 16px;
            scroll-behavior: smooth;
        }
        .message { display: flex; gap: 10px; max-width: 92%; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar {
            width: 32px; height: 32px; flex: 0 0 32px;
            border-radius: 10px; display: grid; place-items: center;
            font-size: 12px; font-weight: 700;
            background: var(--brand-soft); color: var(--brand);
        }
        .message.user .avatar { background: #e8f7f1; color: var(--ok); }
        .bubble {
            padding: 12px 15px; border-radius: 14px;
            background: #f7f9fd; border: 1px solid #edf1f9;
            line-height: 1.7; font-size: 14px;
            white-space: pre-wrap; word-break: break-word;
        }
        .message.user .bubble { background: var(--brand); border-color: var(--brand); color: #fff; }
        .meta { margin-top: 6px; font-size: 11px; color: var(--muted); }
        .tool-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .tool-card {
            border: 1px solid #dce6ff; background: #f5f8ff;
            border-radius: 10px; padding: 9px 11px;
            font-size: 12px; color: #31508f;
            display: flex; align-items: center; gap: 8px;
        }
        .tool-card.done { border-color: #cdeee1; background: #f2fbf7; color: #0b7a55; }
        .tool-card.failed { border-color: #ffd9c7; background: #fff7f2; color: var(--err); }
        .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: currentColor; flex: 0 0 7px;
        }
        .tool-card.running .dot { animation: pulse 1s infinite ease-in-out; }
        @keyframes pulse { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
        .typing::after {
            content: ""; display: inline-block; width: 6px; height: 14px;
            margin-left: 2px; vertical-align: -2px;
            background: var(--brand); border-radius: 2px;
            animation: blink .9s steps(2, start) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .composer {
            border-top: 1px solid var(--line);
            padding: 13px;
            display: flex; gap: 10px;
            background: #fff;
        }
        textarea {
            flex: 1; resize: none; min-height: 46px; max-height: 130px;
            padding: 12px 13px; border-radius: 12px;
            border: 1px solid var(--line); outline: none; line-height: 1.5;
        }
        textarea:focus { border-color: #b9c9f3; box-shadow: 0 0 0 3px rgba(47,107,255,.08); }
        .composer .primary { height: 46px; min-width: 84px; }
        aside {
            min-height: 0; overflow-y: auto;
            background: rgba(255,255,255,.75);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }
        aside h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .4px; }
        .examples { display: flex; flex-direction: column; gap: 8px; }
        .example {
            text-align: left; height: auto; padding: 10px 12px;
            border-radius: 11px; line-height: 1.5; font-size: 13px;
            background: #fff;
        }
        .notice {
            margin-top: 16px; padding: 11px 12px;
            border-radius: 11px; background: #fff8ea; border: 1px solid #f3e2b8;
            color: #7a5a12; font-size: 12px; line-height: 1.6;
        }
        .status { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.7; }
        .session { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; color: var(--muted); }
        .error-text { color: var(--err); }
        .welcome strong { color: var(--brand); }
        @media (max-width: 820px) {
            .shell { padding: 10px; height: 100dvh; }
            main { grid-template-columns: 1fr; }
            aside { display: none; }
            header { align-items: flex-start; flex-direction: column; }
            .controls { width: 100%; justify-content: flex-start; }
        }
    </style>
</head>
<body>
<div class="shell">
    <header>
        <div class="brand">
            <div class="logo">AI</div>
            <div>
                <h1>小智 · 电商售后客服</h1>
                <p>AgentScope 多 Agent · 本地知识库 · 订单工具</p>
            </div>
        </div>
        <div class="controls">
            <select id="userSelect" title="切换演示用户">
                <option value="user-001">user-001 张先生</option>
                <option value="user-002">user-002 李女士</option>
            </select>
            <button id="newSession" class="ghost">新会话</button>
            <button id="stopBtn" class="ghost" disabled>停止</button>
        </div>
    </header>

    <main>
        <section class="chat">
            <div id="messages" class="messages">
                <div class="message assistant">
                    <div class="avatar">AI</div>
                    <div class="bubble welcome">
                        <strong>你好，我是小智。</strong>
                        我可以帮你查订单、物流、退款进度，也能回答退换货、价保、运费、发票等售后政策。
                        订单和退款数据来自演示库，政策答案会标注来源。
                        <div class="meta">当前是 user-001 的演示会话；可切换用户验证数据隔离。</div>
                    </div>
                </div>
            </div>
            <div class="composer">
                <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
                <button id="sendBtn" class="primary">发送</button>
            </div>
        </section>

        <aside>
            <h2>试试这些问题</h2>
            <div class="examples">
                <button class="example" data-q="查一下我最近的订单">查一下我最近的订单</button>
                <button class="example" data-q="订单 O20261023003 到哪了">订单 O20261023003 到哪了</button>
                <button class="example" data-q="我的退款到哪一步了">我的退款到哪一步了</button>
                <button class="example" data-q="7天无理由怎么算">7天无理由怎么算</button>
                <button class="example" data-q="我要投诉，商品有质量问题">我要投诉，商品有质量问题</button>
            </div>
            <div class="notice">
                演示账号：user-001 有 4 笔订单（已签收 / 运输中 / 退款中 / 待发货）；
                user-002 只有 1 笔，可用于验证越权查询会被拒绝。
            </div>
            <div class="status">
                会话 ID<br>
                <span id="sessionLabel" class="session"></span>
            </div>
        </aside>
    </main>
</div>

<script>
(() => {
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const stopBtn = document.getElementById('stopBtn');
    const newSessionBtn = document.getElementById('newSession');
    const userSelect = document.getElementById('userSelect');
    const sessionLabel = document.getElementById('sessionLabel');

    const TOOL_LABELS = {
        order_expert: { running: '订单专家正在处理', done: '订单专家已完成', failed: '订单专家处理失败' },
        policy_expert: { running: '政策专家正在检索知识库', done: '政策专家已完成', failed: '政策专家处理失败' },
        handoff_to_human: { running: '正在创建转人工工单', done: '转人工工单已创建', failed: '转人工失败' }
    };

    let sessionId = sessionStorage.getItem('cs-session-id') || newSessionId();
    let controller = null;
    let streaming = false;

    sessionLabel.textContent = sessionId;

    function newSessionId() {
        const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
        sessionStorage.setItem('cs-session-id', id);
        return id;
    }

    function setStreaming(value) {
        streaming = value;
        sendBtn.disabled = value;
        stopBtn.disabled = !value;
        inputEl.disabled = value;
    }

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUserMessage(text) {
        const wrap = document.createElement('div');
        wrap.className = 'message user';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = '我';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        wrap.append(avatar, bubble);
        messagesEl.appendChild(wrap);
        scrollToBottom();
    }

    function addAssistantMessage() {
        const wrap = document.createElement('div');
        wrap.className = 'message assistant';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble typing';
        const toolList = document.createElement('div');
        toolList.className = 'tool-list';
        bubble.appendChild(toolList);
        const text = document.createElement('span');
        text.className = 'answer';
        bubble.appendChild(text);
        wrap.append(avatar, bubble);
        messagesEl.appendChild(wrap);
        scrollToBottom();
        return { wrap, bubble, toolList, text, tools: new Map() };
    }

    function toolCard(turn, name) {
        const key = name || 'tool';
        let card = turn.tools.get(key);
        if (card) return card;
        const labels = TOOL_LABELS[name] || { running: name, done: name || '工具已完成', failed: name || '工具失败' };
        const el = document.createElement('div');
        el.className = 'tool-card running';
        const dot = document.createElement('span');
        dot.className = 'dot';
        const label = document.createElement('span');
        label.textContent = labels.running;
        el.append(dot, label);
        turn.toolList.appendChild(el);
        card = { el, label, labels };
        turn.tools.set(key, card);
        return card;
    }

    function finishTool(turn, name, state) {
        const card = toolCard(turn, name);
        const failed = state && /FAIL|ERROR|DENIED|REJECT/i.test(state);
        card.el.classList.remove('running');
        card.el.classList.add(failed ? 'failed' : 'done');
        card.label.textContent = failed ? card.labels.failed : card.labels.done;
    }

    function appendError(turn, message) {
        turn.bubble.classList.remove('typing');
        const error = document.createElement('div');
        error.className = 'error-text';
        error.textContent = message;
        turn.bubble.appendChild(error);
        scrollToBottom();
    }

    async function send(text) {
        if (streaming || !text.trim()) return;
        const userId = userSelect.value;
        addUserMessage(text.trim());
        const turn = addAssistantMessage();
        setStreaming(true);
        controller = new AbortController();

        try {
            const response = await fetch('/api/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-User-Id': userId
                },
                body: JSON.stringify({ sessionId, message: text.trim() }),
                signal: controller.signal
            });

            if (!response.ok || !response.body) {
                let message = '请求失败，请稍后重试。';
                try {
                    const body = await response.json();
                    if (body && body.error) message = body.error;
                } catch (_) { /* ignore */ }
                appendError(turn, message);
                return;
            }

            await readSse(response.body, turn);
        } catch (error) {
            if (error && error.name === 'AbortError') {
                turn.bubble.classList.remove('typing');
                const stopped = document.createElement('div');
                stopped.className = 'meta';
                stopped.textContent = '已停止生成';
                turn.bubble.appendChild(stopped);
            } else {
                appendError(turn, '网络异常，请稍后重试。');
            }
        } finally {
            turn.bubble.classList.remove('typing');
            if (!turn.text.textContent.trim() && !turn.toolList.children.length) {
                turn.bubble.classList.add('typing');
            }
            setStreaming(false);
            controller = null;
            scrollToBottom();
        }
    }

    async function readSse(body, turn) {
        const reader = body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            let boundary;
            while ((boundary = buffer.indexOf('\n\n')) >= 0) {
                const frame = buffer.slice(0, boundary);
                buffer = buffer.slice(boundary + 2);
                handleFrame(frame, turn);
            }
        }
        if (buffer.trim()) handleFrame(buffer, turn);
    }

    function handleFrame(frame, turn) {
        let eventName = 'message';
        const dataLines = [];
        for (const line of frame.split(/\r?\n/)) {
            if (line.startsWith('event:')) eventName = line.slice(6).trim();
            else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        }
        if (!dataLines.length) return;
        let data;
        try { data = JSON.parse(dataLines.join('\n')); } catch (_) { data = dataLines.join('\n'); }

        if (eventName === 'reply') {
            turn.text.textContent += data.delta || '';
            turn.bubble.classList.remove('typing');
            scrollToBottom();
        } else if (eventName === 'tool_call') {
            toolCard(turn, data.name);
            scrollToBottom();
        } else if (eventName === 'tool_result') {
            finishTool(turn, data.name, data.state);
            scrollToBottom();
        } else if (eventName === 'error') {
            appendError(turn, data.message || '模型服务暂时不可用，请稍后重试。');
        }
    }

    sendBtn.addEventListener('click', () => {
        const text = inputEl.value;
        inputEl.value = '';
        inputEl.style.height = 'auto';
        send(text);
    });

    inputEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendBtn.click();
        }
    });

    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
    });

    stopBtn.addEventListener('click', () => {
        if (controller) controller.abort();
    });

    newSessionBtn.addEventListener('click', () => {
        if (streaming) return;
        sessionId = newSessionId();
        sessionLabel.textContent = sessionId;
        messagesEl.querySelectorAll('.message:not(:first-child)').forEach(el => el.remove());
    });

    userSelect.addEventListener('change', () => {
        if (streaming) return;
        sessionId = newSessionId();
        sessionLabel.textContent = sessionId;
        messagesEl.querySelectorAll('.message:not(:first-child)').forEach(el => el.remove());
    });

    document.querySelectorAll('.example').forEach(button => {
        button.addEventListener('click', () => send(button.dataset.q || button.textContent));
    });
})();
</script>
</body>
</html>
